name: eventflow

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventflow-dev}
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Added later, on the day each one is built:
  #   ingest    (Day 2)  Python service, depends_on postgres: service_healthy
  #   agent     (Day 13) C++ edge agent
  #   toxiproxy (Day 15) network fault injection, test profile only

volumes:
  pgdata:
