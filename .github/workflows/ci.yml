name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs and compose sanity checks
        run: make check

  ingest-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test

  # Added later:
  #   agent-build-test  (Day 6)  CMake + GoogleTest
  #   agent-asan-ubsan  (Day 6)  AddressSanitizer + UndefinedBehaviorSanitizer
  #   agent-tsan        (Day 6)  ThreadSanitizer
  #   chaos-fixed-seed  (Day 13) end-to-end failure scenarios
